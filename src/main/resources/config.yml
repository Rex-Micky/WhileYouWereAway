# ============================================================
#  WhileYouWereAway  —  by Rex's Studio (studio.rexmicky.dev)
#  Log in and get a personalized recap of everything that
#  happened on the server while you were offline.
# ============================================================

# Don't show a recap for quick relogs shorter than this (seconds).
min-away-seconds: 120

base:
  radius: 24                  # how close another player must be to count as "near your base"
  visit-cooldown-seconds: 120 # don't recount the same visitor more often than this

# Toggle individual recap sections on/off.
recap:
  show-days-passed: true
  show-online-players: true
  show-base-visits: true
  show-mail: true
  max-names: 10               # cap how many player names are listed

# --- Daily rewards & login streaks ---------------------------------------
# Reward players for logging in each day. Keep a streak going for bigger
# rewards; miss a day and it resets. Rewards are items, XP, or console
# commands — so you can hand out money, ranks or crate keys via any plugin.
daily-rewards:
  enabled: true
  reset-on-miss: true         # miss a day → streak resets to 1
  reward:
    xp: 20
    items:
      - "DIAMOND:1"
    commands: []              # e.g. "eco give {player} 100"
  # Bonus rewards on specific streak days, added on top of the daily reward.
  milestones:
    3:
      message: "&a3-day streak! Here's a little bonus."
      items: ["GOLDEN_APPLE:1"]
    7:
      message: "&6A full week! Big bonus unlocked."
      items: ["DIAMOND_BLOCK:1"]
    30:
      message: "&d30 days straight — you're a legend."
      items: ["NETHERITE_INGOT:1"]

# --- Comeback bonus ------------------------------------------------------
# A welcome-back reward that scales with how long you were gone — the nudge
# that pulls lapsed players back. You get the highest tier you qualify for.
comeback:
  enabled: true
  tiers:                       # keyed by whole days away
    2:
      message: "&bWelcome back! Here's a little something for returning."
      items: ["EXPERIENCE_BOTTLE:8"]
    7:
      message: "&bIt's been a while — welcome back!"
      items: ["DIAMOND:3"]
    30:
      message: "&bA legend returns. Welcome home!"
      items: ["DIAMOND_BLOCK:1"]

# --- The Gazette: your recap delivered as a newspaper --------------------
# Turns the login recap into a written book with headlines — far more
# memorable than chat lines. /wywa chronicle reopens the latest edition.
chronicle:
  enabled: true
  auto-open: true               # open the Gazette automatically on login
  server-name: "The Gazette"    # masthead title

# --- Loyalty: your login streak, made visible --------------------------
# A floating shrine above your base shows your loyalty tier and grows as
# your streak climbs. Tiers are reached at the streak thresholds below.
loyalty:
  enabled: true
  shrine: true
  tiers:
    - { at: 0,  name: "&7Newcomer" }
    - { at: 3,  name: "&aRegular" }
    - { at: 7,  name: "&bDevoted" }
    - { at: 14, name: "&dLoyal" }
    - { at: 30, name: "&6Legend" }

# --- The Watcher: your base guardian -----------------------------------
# A companion that lives at your base, guards it against intruders while
# you're offline, and grows stronger with your loyalty tier.
watcher:
  enabled: true
  # Which mob guards your base. IRON_GOLEM is the default because tameable
  # companions (WOLF, CAT) use owner-defence AI and will NOT chase intruders.
  # Good alternatives: SNOW_GOLEM, VINDICATOR, RAVAGER. WOLF works as a purely
  # decorative companion if you don't need it to actually fight.
  mob-type: IRON_GOLEM
  invulnerable: true            # the Watcher can't be killed while you're away
  guard-range: 16               # how far it will chase intruders from your base

# --- Return Tour: a cinematic welcome home -----------------------------
return-tour:
  enabled: true

